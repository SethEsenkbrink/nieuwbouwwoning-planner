# ─────────────────────────────────────────────────────────────────────────────
# Netlify-configuratie — Woningdossier
# Instellingen hier overrulen wat er in de Netlify UI staat.
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Reproduceerbare installs op CI.
  NPM_FLAGS = "--prefer-offline --no-audit"

# ── SPA-fallback ─────────────────────────────────────────────────────────────
# Client-side routing: elke onbekende route serveert index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# ─────────────────────────────────────────────────────────────────────────────
# Security headers
#
# Zero-network en 100% lokaal: connect-src 'none', geen externe scripts/CDNs.
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Geen enkele pagina mag in een iframe geladen worden (clickjacking).
    X-Frame-Options = "DENY"

    # Browser mag content-types niet zelf raden.
    X-Content-Type-Options = "nosniff"

    # Alleen de origin meesturen bij cross-origin navigatie.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Browserfeatures die deze app niet gebruikt, hard uitzetten.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # Forceer HTTPS voor twee jaar, inclusief subdomeinen.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Isoleer het browsing-context van andere origins.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # 'wasm-unsafe-eval' in script-src is GEEN versoepeling van 'unsafe-eval'.
    # Het is de smalle variant die uitsluitend WebAssembly.compile() toestaat en
    # eval() van JavaScript nog steeds blokkeert. Zonder deze bron weigert Chrome
    # de Argon2id-WASM van hash-wasm, en dan is een kluis aanmaken of ontgrendelen
    # onmogelijk - precies wat er op nieuwbouwplanner.netlify.app gebeurde.
    # ⚠ LET OP DE BACKSLASHES aan het einde van elke regel.
    Content-Security-Policy = """\
default-src 'self'; \
base-uri 'self'; \
object-src 'none'; \
frame-ancestors 'none'; \
form-action 'self'; \
img-src 'self' data: blob:; \
font-src 'self' data:; \
style-src 'self'; \
script-src 'self' 'wasm-unsafe-eval'; \
connect-src 'none'; \
frame-src 'none'; \
worker-src 'self' blob:; \
manifest-src 'self'; \
upgrade-insecure-requests\
"""

# Gehashte assets mogen permanent gecached worden.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html nooit cachen — anders zien gebruikers na een deploy oude JS-verwijzingen.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
